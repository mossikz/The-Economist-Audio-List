name: Sync with upstream

on:
  schedule:
    - cron: '0 9 * * 5' # Fridays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote add upstream https://github.com/jingking/The-Economist-Audio-List.git
          git fetch upstream main
          git merge --no-edit upstream/main || { git merge --abort; echo "Merge conflict - resolve manually"; exit 1; }
          git push origin HEAD:main
